<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>CET-6 Vocabulary</title>
<style>
  :root{--bg:#f8fafc;--panel:#fff;--text:#182333;--muted:#64748b;--border:#e7ebf0;--blue:#2563eb;--blue-bg:#eff6ff;--mask:#dae2ed;--hover:#f6f8fc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:18px auto 80px;padding:0 22px}
  h1{font-size:21px;font-weight:700;letter-spacing:.01em;margin:0 0 18px 2px}
  .sheet{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:0 8px 35px rgba(23,42,67,.035)}
  .line{display:grid;grid-template-columns:84px minmax(185px,1fr) minmax(250px,1.5fr) 138px;align-items:center;column-gap:15px;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--border)}
  .line:last-child{border-bottom:none}
  .line:hover{background:var(--hover)}
  .tools,.counter{display:flex;align-items:center;gap:7px}
  .tools{justify-content:flex-start}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:35px;height:35px;border:1px solid #dde5ef;border-radius:9px;background:#fff;color:#51627b;cursor:pointer;padding:0;flex:none;transition:background .12s,border-color .12s,color .12s}
  .icon-btn{text-decoration:none}
  .icon-btn:disabled{opacity:.35;cursor:default}
  .icon-btn:hover{background:#eff4ff;border-color:#c7d8f8;color:#1d4ed8}
  .icon-btn:focus-visible,.word:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
  .icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.playing{color:var(--blue);border-color:#b8d0ff;background:var(--blue-bg)}
  .icon-btn.loop-on{background:#2563eb;border-color:#2563eb;color:white}
  .icon-btn.loop-on:hover{background:#1d4ed8}
  .word{font-size:16px;line-height:1.45;min-height:25px;display:inline-flex;align-items:center;width:fit-content;max-width:100%;padding:3px 5px;border:0;border-radius:6px;background:transparent;cursor:pointer;text-align:left;font-family:inherit;white-space:normal;word-break:break-word}
  .en{font-weight:650;letter-spacing:.015em}
  .zh{font-size:15px;color:#475569}
  .word.masked{color:transparent!important;background:var(--mask);user-select:none;-webkit-user-select:none}
  .word.masked:hover{background:#cbd5e1}
  .counter{justify-content:flex-end;gap:10px;font-variant-numeric:tabular-nums}
  .counter .icon-btn{width:31px;height:31px;border-color:#e0e7ef}
  .counter .icon-btn svg{width:16px;height:16px}
  .count{width:24px;text-align:center;font-size:16px;font-weight:650;color:#334155}
  .count.nonzero{color:#b45309}
  /* Pinned compact controls: independent of all saved per-word masks. */
  .quickbar{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .quickbar-inner{max-width:1100px;min-height:54px;margin:0 auto;padding:7px 22px;display:flex;align-items:center;gap:9px}
  .global-btn{border:1px solid #dbe3ed;border-radius:9px;padding:7px 13px;background:#fff;color:#334155;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:36px}
  .global-btn:hover{background:#eff4ff;border-color:#c7d8f8}
  .global-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
  .audio-status{max-width:1100px;margin:0 auto;padding:0 8px 7px;color:#9a3412;font-size:13px}
  .audio-status a,.sources{color:#1d4ed8}
  .sources{font-size:13px;margin-left:auto;white-space:nowrap}
  .sync-status{max-width:1100px;margin:0 auto;padding:0 8px 7px;color:var(--muted);font-size:13px}
  .sync-status:empty{display:none}
  #sync-logout{padding-inline:7px}
  @media(max-width:395px){.quickbar-inner{flex-wrap:wrap}.sources{font-size:12px}}
  .audio-status:empty{display:none}
  .global-btn[aria-pressed="true"]{border-color:#bfdbfe;background:#eaf2ff;color:#1d4ed8}
  /* Global visibility is a visual overlay, not a write to each word's mask. */
  body.hide-all-en .word.en,body.hide-all-zh .word.zh{color:transparent!important;background:var(--mask);user-select:none;-webkit-user-select:none}
  body.hide-all-en .word.en:hover,body.hide-all-zh .word.zh:hover{background:#cbd5e1}
  @media(max-width:800px){.quickbar-inner{padding:7px 8px;min-height:51px;gap:7px}.global-btn{font-size:12px;padding:6px 10px;min-height:34px}.wrap{margin:15px auto 55px;padding:0 8px}h1{font-size:19px;margin-left:8px}.sheet{border-radius:10px}.line{grid-template-columns:70px minmax(108px,1fr) minmax(100px,1.4fr) 92px;column-gap:5px;padding:7px 8px;min-height:54px}.tools{gap:4px}.icon-btn{width:31px;height:31px;border-radius:8px}.icon-btn svg{width:17px;height:17px}.word{font-size:14px;padding:3px}.zh{font-size:13px}.counter{gap:4px}.counter .icon-btn{width:26px;height:26px}.count{width:17px;font-size:14px}}
  @media(max-width:440px){.line{grid-template-columns:66px minmax(90px,1fr) minmax(75px,1.4fr) 86px;gap:3px}.word{font-size:12px}.zh{font-size:12px}.counter .icon-btn{width:25px;height:25px}}
  @media(max-width:375px){.line{grid-template-columns:66px minmax(0,1fr) minmax(0,1.4fr) 86px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="quickbar" aria-label="批量显示与隐藏">
 <div class="quickbar-inner">

  <button type="button" class="global-btn" id="toggle-all-zh" aria-pressed="false">隐藏中文</button>
  <button type="button" class="global-btn" id="sync-button" hidden disabled>登录同步</button>
  <button type="button" class="global-btn" id="sync-logout" hidden>退出</button>
  <a class="sources" href="./pronunciation-sources.html">发音来源</a>
 </div>
 <p class="sync-status" id="sync-status" role="status"></p>
 <p class="audio-status" id="audio-status" role="status"></p>
</header>
<main class="wrap"><div id="sheet" class="sheet"></div></main>

 const switching=activeIndex!==i;
 const token=++ticket;
 activeIndex=i;playState='playing';
 audioStatus.textContent='';
 recording.loop=loopIndex===i;
 if(switching)recording.src='./us-audio/'+i+'.mp3';
 recording.onerror=()=>{
  if(recording.error)recordingFailed(i,token);
 };
 refresh();
 // Keep play() in the tap handler so Safari can grant media playback.
 recording.play().catch(()=>recordingFailed(i,token));
}
function togglePlay(i){
 if(i===activeIndex){
  if(playState==='playing'){
   ticket++;recording.pause();
   playState='paused';refresh();return;
  }
 }
 if(loopIndex!==i)loopIndex=-1;
 playRecording(i);
}
function toggleLoop(i){
 if(loopIndex===i){
  loopIndex=-1;
  if(recording)recording.loop=false;
  refresh();return;
 }
 loopIndex=i;
 if(activeIndex!==i||playState!=='playing'){playRecording(i);return}
 if(recording)recording.loop=true;
 refresh();
}
sheet.addEventListener('click',e=>{
 if(e.target.closest('.tools a')){loopIndex=-1;stop();audioStatus.textContent='';return}
 const btn=e.target.closest('button[data-act]');if(!btn)return;
 const row=btn.closest('.line');if(!row)return;
 const i=Number(row.dataset.i),action=btn.dataset.act;
 if(action==='play'){togglePlay(i);return}
 if(action==='loop'){if(!btn.disabled)toggleLoop(i);return}
 const value=entry(i);
 if(action==='en'||action==='zh'){
  const field=action==='en'?'em':'zm';
  value[field]=!value[field];
  window.cet6Progress.record?.(i,field,value[field]);
 }else{
  const delta=action==='plus'?1:-1;
  value.n=Math.min(1_000_000,Math.max(0,(Number(value.n)||0)+delta));
  window.cet6Progress.record?.(i,'n',delta);
 }
 paintProgress(i);
 save();
});
window.addEventListener('pagehide',()=>{loopIndex=-1;stop()});
</script>
<script type="module" src="./progress-sync.js"></script>
</body>
